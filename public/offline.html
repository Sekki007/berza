<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3d9a50">
  <title>Offline — KupiTelefon</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f8f6;color:#1a1a1a;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;}
    .box{max-width:360px;background:#fff;border:1px solid #dce5dc;border-radius:12px;padding:28px 22px;text-align:center;}
    h1{font-size:20px;margin:0 0 8px;color:#2d7a3e;}
    p{margin:0 0 16px;font-size:14px;line-height:1.45;color:#555;}
    a{display:inline-block;padding:12px 18px;background:#3d9a50;color:#fff;text-decoration:none;border-radius:8px;font-weight:700;font-size:14px;}
  </style>
</head>
<body>
  <div class="box">
    <h1>Nema mreže</h1>
    <p>KupiTelefon trenutno nije dostupan offline. Proveri konekciju pa pokušaj ponovo.</p>
    <a href="/">Nazad na početnu</a>
  </div>
</body>
</html>
